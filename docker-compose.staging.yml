name: bonlift-ai-staging

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set in .env}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}", "--appendonly", "yes"]
    volumes:
      - redis_data:/data

  migrate:
    build:
      context: .
      target: app
    image: ${IMAGE_REGISTRY:-ghcr.io/siangweisolutiondetails}/bonlift-app:${IMAGE_TAG:-staging}
    env_file: .env
    # Calls node-pg-migrate directly: the package script needs a .env file inside the container. Reads DATABASE_URL.
    command: ["node", "node_modules/node-pg-migrate/bin/node-pg-migrate.js", "--migration-file-language", "sql", "-m", "packages/db/migrations", "up"]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    image: ${IMAGE_REGISTRY:-ghcr.io/siangweisolutiondetails}/bonlift-app:${IMAGE_TAG:-staging}
    restart: unless-stopped
    env_file: .env
    # Least-privilege role with a 30s statement_timeout (deploy/db-roles.sql); only migrate uses the owner DATABASE_URL.
    environment:
      DATABASE_URL: ${API_DATABASE_URL:?API_DATABASE_URL must be set in .env}
    command: ["node", "packages/api/dist/server.js"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started

  worker:
    image: ${IMAGE_REGISTRY:-ghcr.io/siangweisolutiondetails}/bonlift-app:${IMAGE_TAG:-staging}
    restart: unless-stopped
    env_file: .env
    # Least-privilege role with a 5min statement_timeout (deploy/db-roles.sql)
    environment:
      DATABASE_URL: ${WORKER_DATABASE_URL:?WORKER_DATABASE_URL must be set in .env}
    command: ["node", "packages/worker/dist/main.js"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started

  web:
    build:
      context: .
      target: web
    image: ${IMAGE_REGISTRY:-ghcr.io/siangweisolutiondetails}/bonlift-web:${IMAGE_TAG:-staging}
    restart: unless-stopped
    environment:
      ADMIN_HOST: ${ADMIN_HOST:?ADMIN_HOST must be set in .env}
      API_HOST: ${API_HOST:?API_HOST must be set in .env}
    # Reachable only through the cloudflared tunnel on this host.
    ports:
      - "127.0.0.1:80:80"
    volumes:
      - caddy_data:/data
    depends_on:
      - api

volumes:
  pg_data:
  redis_data:
  caddy_data:

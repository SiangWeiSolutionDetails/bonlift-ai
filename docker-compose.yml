services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ai_services_dev
      POSTGRES_USER: ai_services
      POSTGRES_PASSWORD: ai_services
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  pg_data:
  redis_data:

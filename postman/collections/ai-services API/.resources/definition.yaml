$kind: collection
description: "Brands and Outlets modules. Run the folders top-to-bottom: create requests store `brandId` / `brandName` / `outletId` / `outletName` into collection variables for later requests."
variables:
  brandId: ""
  brandName: ""
  outletId: ""
  outletName: ""
  unknownUuid: 00000000-0000-4000-8000-000000000000
scripts:
  - type: http:afterResponse
    code: |-
      pm.test('Responds as JSON', () => {
        pm.response.to.have.header('Content-Type');
        pm.expect(pm.response.headers.get('Content-Type')).to.include('application/json');
      });
    language: text/javascript

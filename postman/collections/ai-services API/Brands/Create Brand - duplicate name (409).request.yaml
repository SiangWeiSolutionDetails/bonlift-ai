$kind: http-request
url: "{{baseUrl}}/brands"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "name": "{{brandName}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 409', () => pm.response.to.have.status(409));
      pm.test('Conflict error code', () => pm.expect(pm.response.json().error).to.be.a('string'));
    language: text/javascript
order: 2000

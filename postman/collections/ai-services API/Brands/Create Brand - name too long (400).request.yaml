$kind: http-request
url: "{{baseUrl}}/brands"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "name": "{{longName}}"
    }
scripts:
  - type: beforeRequest
    code: pm.variables.set('longName', 'a'.repeat(256));
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('Status 400', () => pm.response.to.have.status(400));
      pm.test('Validation error', () => pm.expect(pm.response.json().error).to.eql('VALIDATION_ERROR'));
    language: text/javascript
order: 3200

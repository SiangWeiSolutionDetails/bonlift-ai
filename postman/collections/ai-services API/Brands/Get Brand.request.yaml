$kind: http-request
url: "{{baseUrl}}/brands/{{brandId}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 200', () => pm.response.to.have.status(200));
      pm.test('Returns requested brand', () => {
        pm.expect(pm.response.json().id).to.eql(pm.collectionVariables.get('brandId'));
      });
    language: text/javascript
order: 6000

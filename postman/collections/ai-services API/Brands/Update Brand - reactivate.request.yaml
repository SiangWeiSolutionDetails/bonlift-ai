$kind: http-request
url: "{{baseUrl}}/brands/{{brandId}}"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "isActive": true
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 200', () => pm.response.to.have.status(200));
      pm.test('Brand active', () => pm.expect(pm.response.json().isActive).to.eql(true));
    language: text/javascript
order: 13000

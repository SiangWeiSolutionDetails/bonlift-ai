$kind: http-request
url: "{{baseUrl}}/brands/{{brandId}}"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "name": "{{brandName}}"
    }
scripts:
  - type: beforeRequest
    code: pm.collectionVariables.set('brandName', `Brand ${Date.now()} renamed`);
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('Status 200', () => pm.response.to.have.status(200));
      pm.test('Name updated', () => {
        pm.expect(pm.response.json().name).to.eql(pm.collectionVariables.get('brandName'));
      });
    language: text/javascript
order: 9000

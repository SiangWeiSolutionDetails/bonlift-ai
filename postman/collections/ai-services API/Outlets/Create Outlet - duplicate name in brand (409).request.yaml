$kind: http-request
url: "{{baseUrl}}/outlets"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "name": "{{outletName}}",
      "brandId": "{{brandId}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 409', () => pm.response.to.have.status(409));
      pm.test('Conflict error', () => pm.expect(pm.response.json().error).to.eql('CONFLICT'));
    language: text/javascript
order: 1500

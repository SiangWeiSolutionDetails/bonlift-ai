$kind: http-request
url: "{{baseUrl}}/outlets"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "name": "No Brand Outlet"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 400', () => pm.response.to.have.status(400));
      pm.test('Validation error', () => pm.expect(pm.response.json().error).to.eql('VALIDATION_ERROR'));
    language: text/javascript
order: 3000

$kind: http-request
url: "{{baseUrl}}/outlets"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "name": "Orphan Outlet",
      "brandId": "{{unknownUuid}}"
    }
scripts:
  - type: afterResponse
    code: pm.test('Status 404', () => pm.response.to.have.status(404));
    language: text/javascript
order: 2000

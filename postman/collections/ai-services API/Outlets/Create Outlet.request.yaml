$kind: http-request
url: "{{baseUrl}}/outlets"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "name": "{{outletName}}",
      "brandId": "{{brandId}}"
    }
scripts:
  - type: beforeRequest
    code: pm.collectionVariables.set('outletName', `Outlet ${Date.now()}`);
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('Status 201', () => pm.response.to.have.status(201));
      const body = pm.response.json();
      pm.test('Returns created outlet', () => {
        pm.expect(body).to.have.keys('id', 'name', 'brandId', 'isActive');
        pm.expect(body.name).to.eql(pm.collectionVariables.get('outletName'));
        pm.expect(body.brandId).to.eql(pm.collectionVariables.get('brandId'));
        pm.expect(body.isActive).to.eql(true);
      });
      pm.collectionVariables.set('outletId', body.id);
    language: text/javascript
order: 1000

$kind: http-request
url: "{{baseUrl}}/outlets/{{outletId}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 200', () => pm.response.to.have.status(200));
      const body = pm.response.json();
      pm.test('Returns requested outlet', () => {
        pm.expect(body).to.have.keys('id', 'name', 'brandId', 'isActive');
        pm.expect(body.id).to.eql(pm.collectionVariables.get('outletId'));
      });
    language: text/javascript
order: 6000

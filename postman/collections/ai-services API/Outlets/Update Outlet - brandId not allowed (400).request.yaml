$kind: http-request
url: "{{baseUrl}}/outlets/{{outletId}}"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "brandId": "{{unknownUuid}}"
    }
scripts:

$kind: http-request
url: "{{baseUrl}}/outlets/{{unknownUuid}}"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "name": "Ghost Outlet"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 404', () => pm.response.to.have.status(404));
      pm.test('Not found error', () => pm.expect(pm.response.json().error).to.eql('NOT_FOUND'));
    language: text/javascript
order: 13000

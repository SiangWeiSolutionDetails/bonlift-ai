$kind: http-request
url: "{{baseUrl}}/outlets/{{outletId}}"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "name": "Outlet {{$timestamp}} renamed"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 200', () => pm.response.to.have.status(200));
      pm.test('Name updated', () => pm.expect(pm.response.json().name).to.include('renamed'));
    language: text/javascript
order: 9000
